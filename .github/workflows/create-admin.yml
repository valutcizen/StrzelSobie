name: Create Admin User

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to create the user in'
        required: true
        type: choice
        options:
          - staging
          - production
      email:
        description: 'The email address for the new admin user.'
        required: true
      password_hash:
        description: 'The pre-hashed password. This must be generated locally using the application''s hashing algorithm (see README.md for instructions).'
        required: true

jobs:
  create-admin:
    name: Create admin on ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Prepare SQL Script
        id: prepare-script
        run: |
          TEMP_SCRIPT_PATH="./scripts/create-admin-temp.sql"
          cp ./scripts/create-admin.sql.template "$TEMP_SCRIPT_PATH"

          EMAIL='${{ github.event.inputs.email }}'
          PASSWORD_HASH='${{ github.event.inputs.password_hash }}'
          
          # Use a different separator for sed to avoid issues with special characters in the hash
          sed -i "s|__EMAIL__|$EMAIL|g" "$TEMP_SCRIPT_PATH"
          sed -i "s|__PASSWORD_HASH__|$PASSWORD_HASH|g" "$TEMP_SCRIPT_PATH"
          
          echo "script_path=$TEMP_SCRIPT_PATH" >> $GITHUB_OUTPUT

      - name: Execute SQL Script
        run: |
          cd src/worker
          envsubst '$D1_DATABASE_ID' < wrangler.jsonc > wrangler.resolved.jsonc
          npx wrangler --config wrangler.resolved.jsonc d1 execute DB --env ${{ github.event.inputs.environment }} --remote --file=../../${{ steps.prepare-script.outputs.script_path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
