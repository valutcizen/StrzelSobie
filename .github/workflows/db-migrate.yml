name: Apply DB Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migrations on'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  migrate:
    name: Apply migrations on ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply migrations
        run: |
          cd src/worker
          envsubst '$D1_DATABASE_ID $SESSIONS_KV_ID' < wrangler.jsonc > wrangler.resolved.jsonc
          npx wrangler --config wrangler.resolved.jsonc d1 migrations apply DB --env ${{ github.event.inputs.environment }} --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          SESSIONS_KV_ID: ${{ vars.SESSIONS_KV_ID }}
