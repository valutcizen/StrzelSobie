name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Lint code
        run: npm run lint

      - name: Run unit and integration tests
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: tests/coverage

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup database for E2E tests
        run: npm run db:e2e

      - name: Build backend modules
        run: npm run build:backend

      - name: Start backend server
        run: npm run dev:backend &
        env:
          CI: true

      - name: Start frontend server
        run: npm run dev:frontend &
        env:
          CI: true

      - name: Wait for servers to be ready
        run: npx wait-on tcp:localhost:8787 tcp:localhost:5173 --timeout=180000 --log

      - name: Run E2E tests
        run: npm run test:e2e-ci

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: playwright-report
