<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Lokalny test osadzonej mapy</title>
  <style>
    body { font-family: sans-serif; }
    h1 { color: #333; }
    #log { border: 1px solid #ccc; padding: 10px; height: 100px; overflow-y: scroll; background: #f9f9f9; margin-top: 15px;}
    p { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Strona testowa (symulacja zewnętrznego serwisu)</h1>
  <p>Poniżej znajduje się mapa załadowana w <code>iframe</code> z lokalnego serwera deweloperskiego (wrangler dev).</p>

  <iframe
    id="map-iframe"
    src="http://localhost:8787/embed/map"
    style="width: 100%; height: 600px; border: 2px solid #007bff;"
    title="Mapa strzelnic"
  ></iframe>

  <h2>Logi zdarzeń z <code>iframe</code>:</h2>
  <div id="log"></div>

  <script>
    const logDiv = document.getElementById('log');

    function logMessage(message) {
      const p = document.createElement('p');
      p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(p);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    logMessage('Mapa obsługuje kliknięcie pinezki wewnątrz iframe i pokazuje panel boczny.');

    window.addEventListener('message', function(event) {
      // Dla lokalnego testu sprawdzamy, czy origin zgadza się z adresem serwera deweloperskiego
      if (event.origin !== 'http://localhost:8787') {
        logMessage(`Odrzucono wiadomość z nieoczekiwanego źródła: ${event.origin}`);
        return;
      }

      logMessage(`Otrzymano wiadomość: ${JSON.stringify(event.data)}`);

      logMessage('Ten scenariusz nie powinien już nawigować po kliknięciu pinezki.');
    }, false);
  </script>
</body>
</html>
